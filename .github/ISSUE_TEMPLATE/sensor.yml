name: Sumar un sensor o una placa
description: Proponer un modelo nuevo para el catálogo
labels: [catalogo]
body:
  - type: input
    id: modelo
    attributes: { label: Marca y modelo, placeholder: "Seeed S-XXX-01" }
    validations: { required: true }
  - type: input
    id: link
    attributes: { label: Link a la ficha o al manual }
  - type: textarea
    id: registros
    attributes: { label: Mapa de registros Modbus (si es RS485), description: "Función (03/04), registro, escala, unidad" }
  - type: dropdown
    id: probado
    attributes:
      label: ¿Lo probaste en hardware?
      options: ["Sí, anda", "Sí, con problemas", "No, sólo la ficha"]
    validations: { required: true }
