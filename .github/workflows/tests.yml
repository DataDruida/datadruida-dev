name: tests
on:
  push:
  pull_request:
jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests del runtime dd (placa simulada)
        run: python tests/test_runtime.py -v
      - name: Catálogo válido
        run: python -c "import json; c=json.load(open('catalog/catalog.json', encoding='utf-8')); print(len(c['boards']), 'placas,', len(c['sensors']), 'sensores')"
