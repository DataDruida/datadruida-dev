name: firmware
# Compila el firmware con pantalla (MicroPython + LVGL + ddhw) en la nube.
# Sólo cuando cambia firmware/ o a mano. El .bin queda como artefacto del run.
on:
  push:
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  workflow_dispatch:

jobs:
  esp32s3-lvgl:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.2.2
    steps:
      - uses: actions/checkout@v4
      - name: Compilar
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          git config --global --add safe.directory '*'
          chmod +x firmware/build.sh
          ./firmware/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dd-lvgl-esp32s3
          path: firmware/dist/dd-lvgl-esp32s3.bin
          if-no-files-found: error
